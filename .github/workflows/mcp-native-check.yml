name: 安卓 WebView MCP 原生通道验收
on:
  pull_request:
    paths: ["src/lib/mcp*", "src/lib/tool-*.ts", "src/components/tools/**", "android/**", "scripts/*mcp*", "scripts/chat-page-fixture.tsx", ".github/workflows/mcp-native-check.yml"]
  push:
    branches: [main]
    paths: ["src/lib/mcp*", "src/lib/tool-*.ts", "src/components/tools/**", "android/**", "scripts/*mcp*", "scripts/chat-page-fixture.tsx", ".github/workflows/mcp-native-check.yml"]
permissions:
  contents: read
  actions: read
jobs:
  previous-failure:
    runs-on: ubuntu-latest
    steps:
      - name: 读取前次安卓失败报告
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_TEST_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          prior_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$NATIVE_TEST_BRANCH&status=completed&per_page=30" --jq '.workflow_runs[] | select(.name == "安卓 WebView MCP 原生通道验收" and .conclusion == "failure") | .id' | head -n 1)
          if [ -z "$prior_run" ]; then exit 0; fi
          gh run download "$prior_run" --repo "$GITHUB_REPOSITORY" --name android-mcp-native-results --dir /tmp/native-prior || exit 0
          python3 - <<'PYREPORT'
          from pathlib import Path
          for report in Path("/tmp/native-prior").rglob("*.xml"):
              print(str(report))
              print(report.read_text(errors="replace")[:40000])
          for log in Path("/tmp/native-prior").rglob("native-logcat-live.txt"):
              lines = log.read_text(errors="replace").splitlines()
              useful = [line for line in lines if any(word in line for word in ["Capacitor", "chromium", "AndroidRuntime", "TestRunner", "McpNative", "FATAL", "lowmemory", "ANR"])]
              print("\n".join(useful[-180:]))
          PYREPORT
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: node --experimental-strip-types scripts/verify-mcp-native.mjs
      - name: 构建真实 App 和仅用于验收的网页入口
        env:
          QIDAO_TARGET: android
          VITE_DIRECT_UPSTREAM: "1"
          VITE_AUTH_ENABLED: "false"
        run: |
          npm run typecheck
          npm run build
          node scripts/copy-static.mjs
          npx cap sync android
          node scripts/with-app-env.mjs node scripts/serve-tool-progress-fixture.mjs --production > /tmp/native-fixture-build.log 2>&1 &
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8081/scripts/native-mcp-fixture.html >/dev/null; then break; fi
            sleep 1
          done
          cp -a .tool-progress-dist/. android/app/src/main/assets/public/
          node scripts/make-keystore.mjs
      - name: 准备设备与本机服务
        run: |
          sudo chmod 666 /dev/kvm
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          node scripts/serve-mcp-native-fixture.mjs > /tmp/native-mcp.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4650/health >/dev/null; then break; fi
            sleep 1
          done
      - name: 预先构建调试 APK，减少模拟器运行时的内存占用
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2
      - name: 安卓模拟器中的原生握手与 AI 实际执行
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 1536M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -feature -Vulkan
          script: bash scripts/verify-android-mcp.sh
      - name: 设备与服务日志
        if: always()
        run: |
          cat /tmp/native-mcp.log || true
          test -f /tmp/native-logcat.txt || timeout 10s adb logcat -d > /tmp/native-logcat.txt || true
          node -e 'const fs=require("node:fs");if(fs.existsSync("/tmp/native-mcp.png"))console.log("QIDAO_PREVIEW "+JSON.stringify({name:"android-mcp",base64:fs.readFileSync("/tmp/native-mcp.png").toString("base64")}));'
          tail -120 /tmp/native-logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-mcp-native-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            /tmp/native-mcp.log
            /tmp/native-logcat.txt
            /tmp/native-mcp.png
            /tmp/native-logcat-live.txt
