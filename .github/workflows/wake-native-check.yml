name: 原生后台唤醒回归

on:
  pull_request:
    paths:
      - "android/app/src/main/java/com/yanping/qidao/Wake*.java"
      - "verify-wake-native.mjs"
      - ".github/workflows/wake-native-check.yml"
  push:
    branches: [main]
    paths:
      - "android/app/src/main/java/com/yanping/qidao/Wake*.java"
      - "verify-wake-native.mjs"
      - ".github/workflows/wake-native-check.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: node verify-wake-native.mjs
