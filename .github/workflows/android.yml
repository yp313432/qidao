name: 构建安卓 App（栖岛）

# 你只要在 GitHub 上点一下，就能拿到装到手机上的 APK。
#
# 为什么在 GitHub 上构建而不是在你自己电脑上：
#   安卓打包需要 JDK + Android SDK + Gradle 一整套环境（好几个 G）。
#   GitHub 的机器上现成都有，而且免费 —— 你的电脑什么都不用装。

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "android/**"
      - "scripts/**"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  # 也可以手动点「Run workflow」触发
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    # 发 Release 直链需要写权限（GITHUB_TOKEN 默认只读）
    permissions:
      contents: write
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 装 Java 21（安卓打包要用）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 备好 Android SDK 组件
        # 不用 android-actions/setup-android：GitHub 的机器本来就预装了 Android SDK，
        # 那个 action 反而会因为它自己要和最新 runner 对齐而失败（第一次就是这样失败的）。
        # 这里只用 sdkmanager 补齐工程真正需要的平台版本。
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK 目录: $SDK"
          echo "--- 已有的平台 ---"
          ls "$SDK/platforms" 2>/dev/null || true
          echo "--- 已有的 build-tools ---"
          ls "$SDK/build-tools" 2>/dev/null || true
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(command -v sdkmanager || true)"; fi
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          # 工程要 compileSdk 36；build-tools 交给 Gradle 自己下（许可已接受）
          "$SM" "platforms;android-36"

      - name: 装依赖
        env:
          # playwright 是本地做界面测试用的，构建 APK 完全不需要它 ——
          # 而它的 postinstall 会去下载 ~150MB 浏览器，在 CI 上是纯粹的浪费和风险
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"
        run: |
          set -o pipefail
          if npm ci --no-audit --no-fund 2>&1 | tee /tmp/npmci.log; then
            echo "✅ 依赖安装完成"
          else
            # 失败时把关键信息直接打出来 —— 否则只能看到一句"进程退出 1"。
            #
            # ⚠️ 2026-10 修：**每一行都要打成 `::error::` 注释**。
            # 之前只有标题那行是注释，详细内容用普通 echo 打进了日志 ——
            # 而日志接口匿名读不到（403，见下面"打包成 APK"那步的同一句注释），
            # 结果就是又一轮"只知道失败了、不知道为什么"。
            # 这个坑真的踩到了：一次 `Missing: lru-cache@11.5.3 from lock file`
            # 让这一轮白等了一趟，最后只能靠本地复现才查出来。
            echo "::error::npm ci 失败，下面是关键行"
            {
              echo "----- node / npm 版本（CI 上是 Node 22 → npm 10）-----"
              node -v; npm -v
              echo "----- 报错关键行 -----"
              # 注意把 "Missing" 也抓上：lock 与 package.json 不同步时报的就是它
              grep -inE "npm error|npm ERR|ERR!|EUSAGE|ERESOLVE|EBADENGINE|Missing|Cannot find|not found|ETARGET|ENOTFOUND|integrity|lock" /tmp/npmci.log | head -40 || true
              echo "----- 日志最后 40 行 -----"
              tail -40 /tmp/npmci.log
            } 2>&1 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            exit 1
          fi

      - name: 构建纯前端产物（界面打进 App 本地）
        env:
          # 目标=安卓：走 SPA 构建；直连上游：App 里不经服务器直接跟模型说话
          QIDAO_TARGET: android
          VITE_DIRECT_UPSTREAM: "1"
          VITE_AUTH_ENABLED: "false"
        run: |
          npm run build
          node scripts/copy-static.mjs
          # cap sync 而不是 cap copy：copy 只搬网页资源，sync 还会生成
          # capacitor.plugins.json / cordova 插件工程等 Gradle 求值时要用的文件
          # （那些文件被 .gitignore 排除了，CI 上必须现生成）
          npx cap sync android

      - name: 构建前自检（把事实打成注释，日志我读不到）
        run: |
          echo "::error::自检 ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null | while IFS= read -r l; do echo "::error::平台: $l"; done
          for f in android/app/src/main/assets/capacitor.plugins.json android/app/src/main/assets/capacitor.config.json android/app/src/main/res/xml/config.xml android/capacitor-cordova-android-plugins/build.gradle android/qidao-release.p12; do
            if [ -e "$f" ]; then echo "::error::✅ 在: $f"; else echo "::error::❌ 缺: $f"; fi
          done
          echo "::error::--- gradle.properties ---"
          cat android/gradle.properties | while IFS= read -r l; do echo "::error::$l"; done
          echo "::error::--- 根 build.gradle 是否 apply variables.gradle ---"
          grep -n "variables.gradle" android/build.gradle | while IFS= read -r l; do echo "::error::$l"; done

      - name: 配置阶段自检（evaluation 错误在这里就会暴露）
        # "A problem occurred evaluating project ':app'" 是**配置阶段**的错误 ——
        # 跑 `help` 就够了（不编译），而且它的日志很短，整段打成注释不会被上限截掉。
        # 完整 assembleRelease 的日志太长，真正出错那段反而被截没了。
        working-directory: android
        run: |
          chmod +x gradlew
          if ./gradlew help --no-daemon --stacktrace > /tmp/help.log 2>&1; then
            echo "✅ 配置阶段正常（那 Value is null 出在别处）"
          else
            echo "::error::配置阶段失败 —— 这就是 Value is null 的真正位置"
            # 先把诊断行抓出来（它们在日志前部，tail 会截掉）
            grep -a "QIDAO-DEBUG" /tmp/help.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -45 /tmp/help.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            exit 1
          fi

      - name: 打包成 APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          # 不加 -P 版本号参数：Gradle 配置阶段传值这条路已经证明会踩
          # "Value is null"，而版本号对安装/覆盖更新没有影响（签名才是关键）。
          if ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log; then
            echo "✅ APK 打包完成"
          else
            # ⚠️ 2026-11-10：上一版只 `tail -80`，堆栈一占就全是 "at org.gradle..."，
            # 真正的病根（"What went wrong" 那几行）被挤到窗口外面，白跑一次 CI。
            # 现在分三段打：① 失败的 task ② What went wrong 及后面 30 行 ③ 编译期 error/e:
            echo "::error::Gradle 打包失败：先看失败的 task 和 What went wrong"
            grep -m 10 -E "Execution failed for task|> Task .* FAILED" /tmp/gradle.log |
              while IFS= read -r line; do echo "::error::$line"; done
            sed -n '/^FAILURE: Build failed/,+45p' /tmp/gradle.log |
              while IFS= read -r line; do [ -n "$line" ] && echo "::error::$line"; done
            grep -m 20 -E "^e: |^error: |error:" /tmp/gradle.log |
              while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: 给 APK 一个稳定的名字，并算 SHA-256
        # 为什么要有这一步：GitHub 的 artifact **永远打包成 zip** ——
        # 手机上装不了、电脑上还得解压一次。用户的 D 盘里因此堆了七十多个
        # 「栖岛-APK (77).zip」和七十多个解压目录（2026-11 用户反馈）。
        #
        # 解法：把 apk 拷成固定名字，作为 **Release 资产**发出去。
        # Release 资产是不打包的原始文件，点一下就是 .apk，可直接传手机安装；
        # 而且每次覆盖同一个名字 → 下载链接永久固定、不会越堆越多：
        #   https://github.com/<owner>/<repo>/releases/download/apk-latest/qidao-latest.apk
        #
        # 顺带把 SHA-256 打进当页摘要：杀毒软件对新 APK 报「检测到病毒」是
        # 名声问题（自签名、无历史），有校验值至少能自己核对文件没被改。
        run: |
          set -euo pipefail
          src=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          mkdir -p out
          cp "$src" out/qidao-latest.apk
          ( cd out && sha256sum qidao-latest.apk > SHA256SUMS.txt )
          sha=$(awk '{print $1}' out/SHA256SUMS.txt)
          mb=$(awk -v b="$(stat -c%s out/qidao-latest.apk)" 'BEGIN{printf "%.1f", b/1048576}')
          {
            echo "## 栖岛 APK"
            echo ""
            echo "- 文件：\`qidao-latest.apk\`（${mb} MB，**不用解压**）"
            echo "- SHA-256：\`${sha}\`"
            echo "- 提交：\`${GITHUB_SHA}\`"
            echo "- 直链（固定不变，可收藏）："
            echo "  https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-latest/qidao-latest.apk"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 发成 Release 直链（.apk 原文件，不再发 zip）
        # permissions: contents: write 在 job 顶部声明（见文件开头），否则建不了 release。
        uses: softprops/action-gh-release@v2
        with:
          # 固定 tag：每次构建覆盖同一个 release 的同一个资产名，
          # 所以下载链接永远是这个，不会像 artifact 那样每次生成新文件名。
          tag_name: apk-latest
          name: 栖岛 APK（自动构建，最新）
          make_latest: false
          body: |
            自动构建，提交 `${{ github.sha }}`。

            下载 `qidao-latest.apk` 直接装（不用解压）。
            校验值看 `SHA256SUMS.txt`。

            装不上或被浏览器/杀软拦：这是自签名、无商店分发的 APK，
            请选择「保留」或在手机上直接下载安装。
          files: |
            out/qidao-latest.apk
            out/SHA256SUMS.txt

      - name: 备份一份 artifact（带版本号，自动过期）
        # 备份用途：Release 那边万一挂掉还能从这一页底部取。
        # 文件名带 run_number 便于对照，保留 14 天就够 —— 反正 Release 有直链。
        uses: actions/upload-artifact@v4
        with:
          name: 栖岛-APK-${{ github.run_number }}
          path: out/qidao-latest.apk
          if-no-files-found: error
          retention-days: 14
