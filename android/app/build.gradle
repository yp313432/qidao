apply plugin: 'com.android.application'

// ── 临时诊断（定位 "Value is null" 用，查清后删）────────────────────────
// 放在 android { } 之前：脚本求值到这里就会打印，即使后面炸了也能看到值。
// CI 的日志接口匿名读不了，但 check-run 注释能读；`gradlew help` 的日志很短，
// 这几行会完整出现在注释里。
println "QIDAO-DEBUG ==="
println "QIDAO-DEBUG ext.has(minSdkVersion)      = " + rootProject.ext.has("minSdkVersion")
println "QIDAO-DEBUG ext.minSdkVersion          = " + rootProject.ext.find("minSdkVersion")
println "QIDAO-DEBUG ext.compileSdkVersion      = " + rootProject.ext.find("compileSdkVersion")
println "QIDAO-DEBUG ext.androidxAppCompatVer   = " + rootProject.ext.find("androidxAppCompatVersion")
println "QIDAO-DEBUG env.QIDAO_VERSION_CODE     = " + System.getenv("QIDAO_VERSION_CODE")
println "QIDAO-DEBUG env.QIDAO_VERSION_NAME     = " + System.getenv("QIDAO_VERSION_NAME")
println "QIDAO-DEBUG signingConfigs.release     = " + (project.hasProperty("signingConfigs") ? "有" : "无")
println "QIDAO-DEBUG 项目目录                    = " + project.projectDir
println "QIDAO-DEBUG ==="

android {
    namespace = "com.yanping.qidao"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.yanping.qidao"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 版本号先写死：之前用 System.getenv 取值，CI 的配置阶段拿到 null，
        // AGP 就抛 "Value is null"（而且只说这一句，完全看不出是哪一行）。
        // 版本号本来也不影响能不能装、能不能覆盖更新 —— 签名才是关键。
        // （android/app/build.gradle 里那个 QIDAO-DEBUG 诊断段确认了这一点：
        //   ext 的值全都正常，只有这两个环境变量是 null。）
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /**
     * 固定签名。
     *
     * 为什么必须固定：安卓按「包名 + 签名」认应用。签名一变，装新版就得先卸载，
     * 而卸载会清掉 App 内部数据（日记、信、设置）。签名固定 → 覆盖安装 → 数据保留。
     *
     * 签名文件由 scripts/make-keystore.mjs 生成（本机没有 Java，用 node-forge 写 PKCS#12）。
     * 口令是公开的：这不是需要保密的钥匙，是「个人自用、不上架商店」的签名。
     * 想换成自己的，用 QIDAO_KEYSTORE / QIDAO_KEYSTORE_PASSWORD 覆盖即可。
     */
    signingConfigs {
        release {
            storeFile file(System.getenv("QIDAO_KEYSTORE") ?: "../qidao-release.p12")
            storePassword System.getenv("QIDAO_KEYSTORE_PASSWORD") ?: "qidao-release-2026"
            keyAlias System.getenv("QIDAO_KEYSTORE_ALIAS") ?: "qidao"
            keyPassword System.getenv("QIDAO_KEYSTORE_PASSWORD") ?: "qidao-release-2026"
            storeType "PKCS12"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            // 调试包也用同一个签名 —— 这样从调试包换到正式包不用卸载（数据不丢）
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
